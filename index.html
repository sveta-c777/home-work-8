<!DOCTYPE html>
<html lang="ua">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>закріплємо flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="block row-1">
  <div class="box"></div>
  <div class="box"></div>
</div>

<div class="block row-2">
  <div class="box"></div>
  <div class="right">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>
</div>

<div class="block row-3">
  <div class="left">
    <div class="box"></div>
    <div class="box"></div>
  </div>
  <div class="right">
    <div class="box"></div>
    <div class="box"></div>
  </div>
</div>

<div class="block row-4">
  <div class="right">
    <div class="box"></div>
    <div class="column">
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </div>
</div>

<div class="block row-5">
  <div class="center">
    <div class="box"></div>
    <div class="column">
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </div>
</div>
</body>
</html>
